name: Validate SplitLongMessagesPlus FakeNitro fix

on:
    push:
        branches:
            - fix/split-long-messages-fakenitro

permissions:
    contents: write

jobs:
    validate-fix:
        if: ${{ !contains(github.event.head_commit.message, '[skip split patch]') }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: fix/split-long-messages-fakenitro
                  fetch-depth: 0

            - name: Finish focused source cleanup
              shell: bash
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  path = Path("src/plugins/splitLongMessagesPlus/index.ts")
                  text = path.read_text(encoding="utf-8")

                  malformed = '''        if (MessageActions?.sendMessage) {
                  this.originalSendMessage = MessageActions.sendMessage.bind(MessageActions);
                  MessageActions.sendMessage = (channelId, msg, waitForChannelReady, options) => {
                      if (msg?.content?.length > MAX_MESSAGE_LENGTH) {
                          const chunks = splitContent(msg.content, MAX_MESSAGE_LENGTH);
                          if (chunks.length > 1) {
                              return sendChunksSequentially(channelId, chunks, msg, options);
                          }
                      }

                      return this.originalSendMessage!(channelId, msg, waitForChannelReady, options);
                  };
              }'''

                  corrected = '''        if (MessageActions?.sendMessage) {
                      this.originalSendMessage = MessageActions.sendMessage.bind(MessageActions);
                      MessageActions.sendMessage = (channelId, msg, waitForChannelReady, options) => {
                          if (msg?.content?.length > MAX_MESSAGE_LENGTH) {
                              const chunks = splitContent(msg.content, MAX_MESSAGE_LENGTH);
                              if (chunks.length > 1) {
                                  return sendChunksSequentially(channelId, chunks, msg, options);
                              }
                          }

                          return this.originalSendMessage!(channelId, msg, waitForChannelReady, options);
                      };
                  }'''

                  if malformed not in text:
                      raise RuntimeError("Expected malformed MessageActions wrapper was not found")
                  text = text.replace(malformed, corrected, 1)

                  unused_helper = '''function stripAutoTextUploads(options: MessageOptions | undefined) {
                      if (!options?.uploads?.length) return;

                      const filtered = options.uploads.filter(upload => !isAutoTextUpload(upload));
                      if (filtered.length !== options.uploads.length) {
                          options.uploads = filtered;
                      }
                  }

                  '''
                  if unused_helper not in text:
                      raise RuntimeError("Expected unused stripAutoTextUploads helper was not found")
                  text = text.replace(unused_helper, "", 1)

                  path.write_text(text, encoding="utf-8")
                  PY

                  git diff --check

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm testTsc

            - name: Lint changed plugin
              run: pnpm exec eslint src/plugins/splitLongMessagesPlus/index.ts

            - name: Commit validated source fix
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/plugins/splitLongMessagesPlus/index.ts
                  git commit -m "Validate SplitLongMessagesPlus FakeNitro fix [skip split patch]"
                  git push origin HEAD:fix/split-long-messages-fakenitro
