name: Regenerate Vencord security lockfile (temporary)

on:
  push:
    branches:
      - maintenance/security-lockfile-2026-10

permissions:
  contents: write

jobs:
  update-lockfile:
    # Avoid a repeat job when the workflow itself commits the regenerated lockfile.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate and validate lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm build
      - name: Push lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
          else
            git commit -m 'chore: regenerate security lockfile [skip ci]'
            git push origin HEAD:maintenance/security-lockfile-2026-10
          fi
