version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    # Routine npm updates are enabled; preserve the ts-patch major-version exclusion.
    open-pull-requests-limit: 10
    ignore:
      # ts-patch 4.x requires Node >=22.15.0, while Vencord currently supports Node >=22.
      # Keep major 4 deferred until the project intentionally raises its Node floor.
      - dependency-name: "ts-patch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
