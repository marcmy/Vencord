packages:
  - packages/*
overrides:
  'brace-expansion@<1.1.17': 1.1.17
  'brace-expansion@>=2.0.0 <2.1.3': 2.1.3
  'brace-expansion@>=4.0.0 <5.0.8': 5.0.8
  'dompurify@<=3.4.12': 3.4.13
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'minimatch@<3.1.4': 3.1.4
  'postcss@<8.5.23': 8.5.23
patchedDependencies:
  eslint-plugin-path-alias@2.1.0: patches/eslint-plugin-path-alias@2.1.0.patch
peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
    - eslint
  allowedVersions:
    "eslint-plugin-import@2.31.0>eslint": "10"
    "eslint-plugin-path-alias@2.1.0>eslint": "10"
    "eslint-plugin-react@7.37.5>eslint": "10"
    "@vencord/discord-types@1.0.2>@types/react": "18.3.1"
allowedDeprecatedVersions:
  source-map-resolve: '*'
  resolve-url: '*'
  source-map-url: '*'
  urix: '*'
  q: '*'
strictPeerDependencies: false
allowBuilds:
  esbuild: true
pmOnFail: warn
minimumReleaseAgeExclude:
  - '@vencord/*'
