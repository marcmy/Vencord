packages:
  - packages/*
overrides:
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=3.0.0 <3.0.6': 3.0.6
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'dompurify@<=3.4.12': 3.4.13
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7
  # Preserve the path-alias plugin's match/list API without snapdragon's vulnerable decoder.
  'eslint-plugin-path-alias>nanomatch': npm:micromatch@4.0.8
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'minimatch@<3.1.4': 3.1.4
  'postcss@<8.5.23': 8.5.23
patchedDependencies:
  eslint-plugin-path-alias@2.1.0: patches/eslint-plugin-path-alias@2.1.0.patch
peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
    - eslint
  allowedVersions:
    "eslint-plugin-import@2.31.0>eslint": "10"
    "eslint-plugin-path-alias@2.1.0>eslint": "10"
    "eslint-plugin-react@7.37.5>eslint": "10"
    "@vencord/discord-types@1.0.2>@types/react": "18.3.1"
allowedDeprecatedVersions:
  source-map-resolve: '*'
  resolve-url: '*'
  source-map-url: '*'
  urix: '*'
  q: '*'
strictPeerDependencies: false
allowBuilds:
  esbuild: true
pmOnFail: warn
minimumReleaseAgeExclude:
  - '@vencord/*'
